# Price-tracker configuration.
# Secrets (Telegram token/chat) live in .env, NOT here.

# How often to run a full poll cycle across all enabled searches.
poll_interval_seconds: 20

# How often the engine prunes old listings, recomputes the stored market
# medians, and posts a Telegram "DB is being updated" heartbeat. Default hourly.
# Set to 0 to disable the periodic refresh.
median_refresh_interval_seconds: 3600

# Rolling window. Listings not seen within this long are pruned from the db, and
# each median is recomputed over what's left. This keeps the db bounded (one db
# file per site, in the volume set by DB_DIR / DB_PATH's folder) and ties the
# median to the recent market rather than the whole history. Default 24h.
retention_window_seconds: 86400

# Below-average deal detection.
# For each (brand, model, year) we keep a SINGLE stored row of price stats
# (median + MAD + low-percentile), recomputed from the full set of comparables
# every hour (see median_refresh_interval_seconds). Evaluation reads that one row and flags a listing whose
# price is meaningfully below the median (see store.update_model_price +
# evaluator.py). These are analysis knobs, not anti-block knobs. (The hard
# request-rate circuit breaker is hardcoded and NOT configurable; see
# price_tracker/ratelimit.py.)
evaluator:
  min_samples: 4 # don't judge a (brand, model, year) group until it has at least this many listings
  # MAD = median absolute deviation: the median of |price - median|, a robust
  # measure of how spread out prices are (outlier-proof, unlike stddev). A
  # listing counts as "statistically cheap" when price <= median - mad_k * MAD,
  # so mad_k is how many MADs below the median it must sit. Higher = stricter
  # (must be further below); lower = looser (flags smaller dips).
  mad_k: 1.5
  bottom_percentile: 20 # ...or price sits in the bottom Nth percentile of the sample
  min_deal_discount: 0.12 # require at least this fraction below the median to alert
  scam_floor_ratio: 0.6 # ignore prices below this fraction of median (likely scam/parts/typo)
  min_price: 1000 # absolute price floor (EUR); below this is noise

notify:
  telegram:
    enabled: true # set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env

sites:
  polovniautomobili:
    enabled: true
    # Polite spacing between HTTP requests to this site (tuning, stays well
    # under the hardcoded circuit breaker). Randomized by +/- jitter.
    request_delay_seconds: 3
    jitter_seconds: 4
    # Results are ordered newest-first, so new posts appear on page 1. We scan
    # from page 1. Leave skip_pages at 0 normally; raise it only if you want to
    # ignore the most-recently-bumped listings at the very top.
    skip_pages: 0
    # First sight of a search: fetch this many pages (from page 1) to seed the
    # comparable corpus, so already-underpriced listings can be judged and
    # alerted right away instead of after days of warm-up. ~25 listings/page.
    seed_pages: 8
    # Steady state: each cycle fetch this many pages from page 1 (the newest
    # listings), a fixed count. Raise it if many new posts arrive between cycles.
    scan_pages: 1
    # Each search is a normal polovniautomobili search-results URL. Build one
    # in your browser with the filters you want, then paste the URL here.
    searches:
      # One search per brand covering ALL of that brand's models within the year
      # range (no model[] filter). Each listing is grouped by its own
      # (brand, model, year, fuel), so every model/year/fuel combo is watched
      # independently — dropping the hand-maintained model[] lists just widens
      # coverage; the stats grouping is unchanged. Per-brand volume stays low
      # enough (15-213 pages) that page 1, sorted newest-first, still covers a
      # comfortable window of new posts each cycle.
      - name: "Audi"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=Audi&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "BMW"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=BMW&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "Citroen"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=Citroen&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "Mazda"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=Mazda&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "Mercedes"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=Mercedes+Benz&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "Opel"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=Opel&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "Peugeot"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=Peugeot&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "Renault"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=Renault&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "Skoda"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=%C5%A0koda&sort=basic&yearFrom=2010&yearTo=2017"
      - name: "VW"
        url: "https://www.polovniautomobili.com/auto-oglasi/pretraga?brand=Volkswagen&sort=basic&yearFrom=2010&yearTo=2017"

  kleinanzeigen:
    # Disabled: we only track polovniautomobili for now. Its rows are purged from
    # the polovni db on open. To add it back later, set enabled: true and add
    # searches — it gets its own kleinanzeigen.db in the same volume, separate
    # from the polovni data.
    enabled: false
    # German classifieds. Server-rendered HTML; the results cards carry only
    # title/price/mileage/EZ, so the structured fields (Marke, Modell,
    # Kraftstoffart, Erstzulassung) are read from each ad's detail page — but
    # ONLY for ads we've never seen. Known ads reuse their stored details, so a
    # detail page is fetched at most once per ad, ever.
    request_delay_seconds: 5
    jitter_seconds: 4
    # kleinanzeigen soft-blocks datacenter IPs: it answers HTTP 200 with a page
    # that has no results container, so the scraper raises "no results
    # container ... (soft block?)" and backs off instead of silently logging 0
    # listings. Getting real results from a datacenter host (e.g. Railway) needs
    # traffic to egress from a non-datacenter IP — approach still TBD.
    # Results are sorted newest-first, so new posts land on page 1.
    skip_pages: 0
    # No seeding: we don't want to bulk-import history, just watch for new posts
    # and grow the comparable corpus organically. Each cycle scans page 1 only.
    seed_enabled: false
    seed_pages: 1 # unused while seed_enabled is false
    scan_pages: 1
    # Each genuinely-new ad costs one detail-page fetch (the results page lacks
    # the structured fields). A burst of new ads — e.g. 27 on first sight — would
    # otherwise fire that many requests back-to-back and risk a soft block. Cap
    # the fetches per cycle; over-budget new ads are picked up in later cycles,
    # draining the backlog at this rate. 0 = unlimited.
    max_detail_fetches_per_cycle: 0
    # Prices are compared per site AND per fuel (a diesel is dearer than the same
    # petrol model-year), so no cross-market or cross-fuel mixing. Build the URL
    # in your browser with the filters you want, then paste it here.
    #searches:
    #  - name: "Aichach ≤2000 EZ 2009+"
    #    url: "https://www.kleinanzeigen.de/s-autos/aichach/preis:2000:/c216l7190r100+autos.ez_i:2009%2C"
